      <!-- K -->
      <path transform="translate(232 70)" d="M7 7 V90 M48 7 L10 52 M24 38 L50 90"/>
      <!-- E -->
      <path transform="translate(308 70)" d="M50 7 H7 V90 H50 M7 48 H40"/>
      <!-- D -->
