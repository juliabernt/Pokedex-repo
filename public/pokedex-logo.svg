<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 30 600 150" width="600" height="150" role="img" aria-label="POKEDEX" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
