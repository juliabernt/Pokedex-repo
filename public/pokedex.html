<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="stylesheet" href="pokedex.css">
    <!--  Icon-Sammlung "Tabler Icons" (feste Hauptversion, damit sich das Aussehen nicht unerwartet ändert) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
</head>

<body>
    <!-- Kopfbereich: Logo links, Menüleiste rechts -->
    <header>
        <a href="pokedex.html" class="logo-link">
            <img src="pokedex-logo.svg" alt="Pokédex Logo" class="logo">
        </a>

        <nav id="topmenu">
            <a class="active" href="pokedex.html"><i class="ti ti-home"></i> Pokedex</a>
            <a href="#" id="favlink"><i class="ti ti-star"></i> Favoriten</a>
            <a href="#" id="comparelink"><i class="ti ti-scale"></i> Vergleichen</a>
            <a href="#"><i class="ti ti-users"></i> Über uns</a>
        </nav>
    </header>
    <div id="layout-container">
        <!-- Seitenleiste links: Filter -->
        <nav id="sidemenu">
            <h3>Filter</h3>

            <!-- Gewicht: Zahlenfelder für die untere und obere Grenze -->
            <label>Gewicht (kg)</label>
            <div class="von-bis">
                <input type="number" id="gewicht-von" placeholder="von">
                <span>bis</span>
                <input type="number" id="gewicht-bis" placeholder="bis">
            </div>

            <!-- Größe: genauso aufgebaut wie das Gewicht -->
            <label>Größe (cm)</label>
            <div class="von-bis">
                <input type="number" id="groesse-von" placeholder="von">
                <span>bis</span>
                <input type="number" id="groesse-bis" placeholder="bis">
            </div>

            <!-- Typ: Auswahlliste, der Wert (value) ist der englische Name wie in der Datenbank -->
            <label>Typ</label>
            <select id="typ">
                <option value="">alle Typen</option>
                <option value="normal">Normal</option>
                <option value="fire">Feuer</option>
                <option value="water">Wasser</option>
                <option value="grass">Pflanze</option>
                <option value="electric">Elektro</option>
                <option value="ice">Eis</option>
                <option value="fighting">Kampf</option>
                <option value="poison">Gift</option>
                <option value="ground">Boden</option>
                <option value="flying">Flug</option>
                <option value="psychic">Psycho</option>
                <option value="bug">Käfer</option>
                <option value="rock">Gestein</option>
                <option value="ghost">Geist</option>
                <option value="dragon">Drache</option>
                <option value="dark">Unlicht</option>
                <option value="steel">Stahl</option>
                <option value="fairy">Fee</option>
            </select>


            <!-- Buttons zum Filtern und Zurücksetzen -->
            <button type="button" id="filterbtn">Filtern</button>
            <button type="button" id="resetbtn">Zurücksetzen</button>
        </nav>
        <!-- Hauptbereich: Suche, Kartenliste und Detailansicht -->
        <main>
            <!-- Suchleiste mit Vorschlagsliste -->
            <div id="searchbar-cont">
                <div class="search-wrapper">
                    <input type="text" id="searchbar" placeholder="Pokémon suchen..." autocomplete="off">
                    <ul id="suggestions-list"></ul>
                </div>
                <button type="button" id="searchbtn">Suchen</button>
            </div>

            <!-- Suchergebnis und Meldungen (Favoriten, Vergleichen) -->
            <div id="search-response-container">
                <p id="searchresponse"></p>
                <img id="searchimage" src="" alt="" style="display: none; width: 150px;">
            </div>

            <!-- Kartenliste, wird per JavaScript befüllt -->
            <ul id="pokemon-list"></ul>

            <!-- Detailansicht: am Anfang versteckt -->
            <section id="detail" style="display: none;">
                <button type="button" id="detail-close" aria-label="Schließen"><i class="ti ti-x"></i></button>

                <!-- Oben: Bild links, Nummer und Name daneben -->
                <div id="detail-header">
                    <img id="detail-bild" src="" alt="">
                    <div>
                        <p id="detail-nr"></p>
                        <h2 id="detail-name"></h2>
                    </div>
                </div>

                <!-- Darunter: weitere Infos, werden per JavaScript befüllt -->
                <div id="detail-info"></div>
            </section>
        </main>
    </div>

    <footer>
        <p>Pokedex Projekt | Web-Programmierung | Armbruster, Bendig, Bernt</p>
    </footer>


    <script>
        // ===== 1. Konstanten und Zustand =====

        // Übersetzung der Typnamen (die Datenbank liefert Englisch, angezeigt wird Deutsch)
        const typnamen = {
            normal: "Normal", fire: "Feuer", water: "Wasser", grass: "Pflanze",
            electric: "Elektro", ice: "Eis", fighting: "Kampf", poison: "Gift",
            ground: "Boden", flying: "Flug", psychic: "Psycho", bug: "Käfer",
            rock: "Gestein", ghost: "Geist", dragon: "Drache", dark: "Unlicht",
            steel: "Stahl", fairy: "Fee"
        };

        // Favoriten (Liste von Pokemon-Nummern) aus dem Browser-Speicher laden
        // localStorage speichert nur Text, JSON.parse wandelt ihn zurück in eine Liste
        // Gibt es noch keine Favoriten, starten wir mit einer leeren Liste
        let favoriten = JSON.parse(localStorage.getItem("favoriten")) || [];

        // Alle Pokemon-Objekte aus der Datenbank
        let allePokemon = [];

        // Pokemon, das die Suche zuletzt gefunden hat (null = keins)
        let gefundenesPokemon = null;

        // Scroll-Position der Liste, wird beim Öffnen der Detailansicht gemerkt
        let gespeicherteScrollPos = 0;

        // HTML-Elemente, die mehrfach gebraucht werden (einmal holen statt jedes Mal neu suchen)
        const pokemonListe = document.getElementById("pokemon-list");
        const detailAnsicht = document.getElementById("detail");
        const typAuswahl = document.getElementById("typ");
        const searchbar = document.getElementById("searchbar");
        const searchbtn = document.getElementById("searchbtn");
        const searchresponse = document.getElementById("searchresponse");
        const searchimage = document.getElementById("searchimage");
        const suggestionsList = document.getElementById("suggestions-list");
        const favlink = document.getElementById("favlink");
        const comparelink = document.getElementById("comparelink");


        // ===== 2. Hilfsfunktionen =====

        // Gibt die Bild-Adresse (Artwork) zu einer Pokemon-Nummer zurück
        function bildUrl(id) {
            return "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/" + id + ".png";
        }

        // Formatiert die Nummer mit führenden Nullen, z.B. 1 -> "Nr. 0001"
        function formatNr(id) {
            return "Nr. " + String(id).padStart(4, "0");
        }

        // Liefert den englischen Typnamen, egal ob der Server "fire" oder {name: "fire"} schickt
        function typName(typ) {
            if (typeof typ === "string") return typ;
            if (typ.type) return typ.type.name;
            return typ.name;
        }

        // Prüft, ob eine Zahl zwischen "von" und "bis" liegt
        // Ist ein Feld leer, wird diese Grenze ignoriert
        function imBereich(zahl, von, bis) {
            if (von !== "" && zahl < Number(von)) {
                return false;
            }
            if (bis !== "" && zahl > Number(bis)) {
                return false;
            }
            return true;
        }

        // Liefert alle Pokemon-Karten der Liste
        function alleKarten() {
            return pokemonListe.querySelectorAll("li");
        }

        // Zeigt nur die Karten, für die pruefe(karte) true liefert, alle anderen werden versteckt
        function zeigeKartenWenn(pruefe) {
            for (let li of alleKarten()) {
                li.style.display = pruefe(li) ? "" : "none";
            }
        }

        // Blendet die Detailansicht aus und die Kartenliste ein
        function zeigeListe() {
            detailAnsicht.style.display = "none";
            pokemonListe.style.display = "";
        }

        // Markiert einen Menüpunkt oben als aktive Seite
        function setzeAktivenMenuepunkt(link) {
            for (let a of document.querySelectorAll("#topmenu a")) {
                a.classList.remove("active");
            }
            link.classList.add("active");
        }

        // Entfernt Text und Bild des Suchergebnisses
        function loescheSuchergebnis() {
            searchresponse.textContent = "";
            searchimage.style.display = "none";
            gefundenesPokemon = null;
        }

        // Baut den Kasten mit den farbigen Typ-Schildern eines Pokemon (für Karte und Detailansicht)
        function erstelleTypSchilder(pokemon) {
            const container = document.createElement("div");
            container.className = "typen";

            // "|| []" heißt: falls es keine Typen gibt, nimm eine leere Liste
            for (let typ of pokemon.types || []) {
                const englisch = typName(typ);
                const schild = document.createElement("span");
                schild.className = "typ typ-" + englisch;   // Die Klasse bestimmt die Farbe
                schild.textContent = typnamen[englisch] || englisch;
                container.appendChild(schild);
            }
            return container;
        }

        // ===== 3. Filter =====

        // Wird beim Klick auf "Filtern" ausgeführt
        // "async", weil wir für den Typ beim Server nachfragen und auf die Antwort warten
        async function filtern() {
            const gewichtVon = document.getElementById("gewicht-von").value;
            const gewichtBis = document.getElementById("gewicht-bis").value;
            const groesseVon = document.getElementById("groesse-von").value;
            const groesseBis = document.getElementById("groesse-bis").value;
            const typ = typAuswahl.value;

            // Ist ein Typ gewählt, fragt der Server, welche Pokemon ihn haben (z.B. /api/pokemon?type=fire)
            // erlaubteIds bleibt null, wenn kein Typ gewählt ist (dann passt jeder Typ)
            let erlaubteIds = null;
            if (typ !== "") {
                const response = await fetch("/api/pokemon?type=" + typ);
                const daten = await response.json();
                erlaubteIds = daten.map(function (pokemon) {
                    return pokemon.id;
                });
            }

            // Karte nur anzeigen, wenn Gewicht UND Größe UND Typ passen
            zeigeKartenWenn(function (li) {
                const passtTyp = erlaubteIds === null || erlaubteIds.includes(Number(li.dataset.id));
                return imBereich(Number(li.dataset.gewicht), gewichtVon, gewichtBis)
                    && imBereich(Number(li.dataset.groesse), groesseVon, groesseBis)
                    && passtTyp;
            });
        }

        // Wird beim Klick auf "Zurücksetzen" ausgeführt
        function filterZuruecksetzen() {
            // Alle Felder leeren
            document.getElementById("gewicht-von").value = "";
            document.getElementById("gewicht-bis").value = "";
            document.getElementById("groesse-von").value = "";
            document.getElementById("groesse-bis").value = "";
            typAuswahl.value = "";

            // Alle Karten wieder anzeigen
            zeigeKartenWenn(function () { return true; });
        }

        // ===== 4. Daten laden und Karten erstellen =====

        // Baut die Karte (Listenelement) für ein einzelnes Pokemon
        function erstelleKarte(pokemon) {
            // Nummer und Maße am Element merken, damit der Filter sie später lesen kann
            const listelement = document.createElement("li");
            listelement.dataset.id = pokemon.id;
            listelement.dataset.gewicht = pokemon.weight / 10;   // In kg umrechnen
            listelement.dataset.groesse = pokemon.height * 10;   // In cm umrechnen

            // Bild: Klick öffnet die Detailansicht
            const imageelement = document.createElement("img");
            imageelement.src = bildUrl(pokemon.id);
            imageelement.loading = "lazy";   // Bild erst laden, wenn man in die Nähe scrollt
            imageelement.alt = pokemon.name;
            imageelement.addEventListener("click", function () {
                zeigeDetail(pokemon);
            });

            // Nummer
            const nrelement = document.createElement("p");
            nrelement.className = "nr";
            nrelement.textContent = formatNr(pokemon.id);

            // Name
            const nameelement = document.createElement("p");
            nameelement.className = "name";
            nameelement.textContent = pokemon.name;

            // Stern-Button: voller Stern = Favorit, leerer Stern = kein Favorit
            const starbutton = document.createElement("button");
            starbutton.className = "stern";
            starbutton.setAttribute("aria-label", "Als Favorit markieren");
            starbutton.textContent = favoriten.includes(pokemon.id) ? "★" : "☆";
            starbutton.addEventListener("click", function () {
                if (favoriten.includes(pokemon.id)) {
                    favoriten.splice(favoriten.indexOf(pokemon.id), 1);
                } else {
                    favoriten.push(pokemon.id);
                }
                starbutton.textContent = favoriten.includes(pokemon.id) ? "★" : "☆";

                // In der Favoriten-Ansicht die Karte sofort ausblenden, wenn der Stern entfernt wird
                if (favlink.classList.contains("active") && !favoriten.includes(pokemon.id)) {
                    listelement.style.display = "none";
                }
                localStorage.setItem("favoriten", JSON.stringify(favoriten));
            });

            // Alles in die Karte legen
            listelement.append(imageelement, nrelement, nameelement, erstelleTypSchilder(pokemon), starbutton);
            return listelement;
        }

        // Holt alle Pokemon vom Server und zeigt für jedes eine Karte an
        async function getdatafromdb() {
            const response = await fetch("/api/pokemon");
            allePokemon = await response.json();

            for (let pokemon of allePokemon) {
                pokemonListe.appendChild(erstelleKarte(pokemon));
            }
        }

        // ===== 5. Suche =====

        // Sucht das erste Pokemon, dessen Name die Eingabe enthält, und zeigt es an
        function searchforpokemon() {
            const eingabe = searchbar.value.toLowerCase().trim();
            suggestionsList.innerHTML = "";   // Vorschlagsliste schließen

            if (eingabe === "") {
                loescheSuchergebnis();
                searchresponse.textContent = "Bitte Namen eingeben";
                return;
            }

            const treffer = allePokemon.find(function (pokemon) {
                return pokemon.name.toLowerCase().includes(eingabe);
            });

            if (!treffer) {
                loescheSuchergebnis();
                searchresponse.textContent = "Kein Pokemon gefunden";
                return;
            }

            // Treffer merken, damit ein Klick auf das Bild die Detailansicht öffnen kann
            gefundenesPokemon = treffer;
            searchresponse.textContent = treffer.name;
            searchimage.src = bildUrl(treffer.id);
            searchimage.alt = treffer.name;
            searchimage.style.display = "block";
        }

        // Holt Namensvorschläge vom Server und zeigt sie unter dem Suchfeld an
        // Wird bei jeder Änderung im Suchfeld ausgeführt (tippen, löschen, einfügen, Autovervollständigung)
        async function ladeVorschlaege() {
            const query = searchbar.value.trim();

            // Ist das Feld leer, alles zurücksetzen und Vorschläge leeren
            if (query === "") {
                loescheSuchergebnis();
                suggestionsList.innerHTML = "";
                return;
            }

            try {
                // Fragt die Backend-Route für die Suche ab
                const response = await fetch("/api/pokemon/search?q=" + encodeURIComponent(query));
                const pokemons = await response.json();

                // Alte Vorschläge leeren, dann pro gefundenem Pokemon einen Eintrag erstellen
                suggestionsList.innerHTML = "";
                for (let pokemon of pokemons) {
                    const li = document.createElement("li");
                    li.textContent = pokemon.name;

                    // Klick auf einen Vorschlag übernimmt den Namen und startet die Suche
                    li.addEventListener("click", function () {
                        searchbar.value = pokemon.name;
                        searchforpokemon();
                    });
                    suggestionsList.appendChild(li);
                }
            } catch (error) {
                console.error("Fehler bei der Autovervollständigung:", error);
            }
        }

        // ===== 6. Menü-Ansichten =====

        // Favoriten-Ansicht: nur Karten anzeigen, deren Nummer in der Favoritenliste steht
        function zeigeFavoriten(event) {
            event.preventDefault();   // Verhindert das Hochspringen durch href="#"

            zeigeListe();
            loescheSuchergebnis();

            // dataset.id ist Text, deshalb mit Number() in eine Zahl umwandeln
            zeigeKartenWenn(function (li) {
                return favoriten.includes(Number(li.dataset.id));
            });

            // Hinweis, falls noch keine Favoriten markiert sind
            if (favoriten.length === 0) {
                searchresponse.textContent = "Du hast noch keine Favoriten. Klick auf den Stern bei einem Pokémon.";
            }
            setzeAktivenMenuepunkt(favlink);
        }

        // Vergleichen-Ansicht: noch nicht verfügbar, es erscheint nur eine Meldung
        function zeigeVergleichen(event) {
            event.preventDefault();   // Verhindert das Hochspringen durch href="#"

            zeigeListe();
            loescheSuchergebnis();

            // Alle Karten verstecken, damit nur die Meldung sichtbar bleibt
            zeigeKartenWenn(function () { return false; });

            searchresponse.textContent = "Die Vergleichsfunktion ist leider noch nicht verfügbar.";
            setzeAktivenMenuepunkt(comparelink);
        }

        // ===== 7. Detailansicht =====

        // Erstellt eine Zeile "Label: Wert" für die Detailansicht
        function infoZeile(label, wert) {
            const zeile = document.createElement("div");
            zeile.className = "detail-row";

            const labelelement = document.createElement("span");
            labelelement.className = "detail-label";
            labelelement.textContent = label;

            const wertelement = document.createElement("span");
            wertelement.className = "detail-wert";
            wertelement.textContent = wert;

            zeile.append(labelelement, wertelement);
            return zeile;
        }

        // Zeigt die Detailansicht für ein Pokemon an
        function zeigeDetail(pokemon) {
            // Scroll-Position nur merken, wenn die Liste gerade sichtbar ist
            // (sonst würde eine offene Detailansicht die gemerkte Position mit 0 überschreiben)
            if (pokemonListe.style.display !== "none") {
                gespeicherteScrollPos = window.scrollY;
            }

            // Feste Elemente befüllen
            document.getElementById("detail-bild").src = bildUrl(pokemon.id);
            document.getElementById("detail-bild").alt = pokemon.name;
            document.getElementById("detail-nr").textContent = formatNr(pokemon.id);
            document.getElementById("detail-name").textContent = pokemon.name;

            // Info-Bereich neu aufbauen
            const info = document.getElementById("detail-info");
            info.innerHTML = "";   // Inhalt vom vorherigen Pokemon löschen

            info.appendChild(infoZeile("Größe", pokemon.height * 10 + " cm"));
            info.appendChild(infoZeile("Gewicht", pokemon.weight / 10 + " kg"));

            // Typ-Zeile: statt Text die farbigen Schilder wie auf der Karte
            const typZeile = infoZeile("Typ", "");
            typZeile.querySelector(".detail-wert").appendChild(erstelleTypSchilder(pokemon));
            info.appendChild(typZeile);

            info.appendChild(infoZeile("KP", pokemon.hp));
            info.appendChild(infoZeile("Angriff", pokemon.attack));
            info.appendChild(infoZeile("Verteidigung", pokemon.defense));
            info.appendChild(infoZeile("Initiative", pokemon.speed));

            // Liste verstecken, Detailansicht zeigen, nach oben springen
            pokemonListe.style.display = "none";
            detailAnsicht.style.display = "block";
            window.scrollTo(0, 0);
        }

        // Schließt die Detailansicht und springt zurück an die alte Stelle in der Liste
        function schliesseDetail() {
            zeigeListe();
            window.scrollTo(0, gespeicherteScrollPos);
        }

        // ===== 8. Ereignisse verbinden und Start =====

        // Filter
        document.getElementById("filterbtn").addEventListener("click", filtern);
        document.getElementById("resetbtn").addEventListener("click", filterZuruecksetzen);

        // Suche: Button und Enter-Taste
        searchbtn.addEventListener("click", searchforpokemon);
        searchbar.addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                searchforpokemon();
            }
        });

        // Suchfeld: bei jeder Änderung Vorschläge laden
        searchbar.addEventListener("input", ladeVorschlaege);

        // Klick irgendwo außerhalb des Suchbereichs schließt die Vorschlagsliste
        document.addEventListener("click", function (event) {
            if (!event.target.closest("#searchbar-cont")) {
                suggestionsList.innerHTML = "";
            }
        });

        // Klick auf das Bild im Suchergebnis öffnet die Detailansicht
        searchimage.addEventListener("click", function () {
            if (gefundenesPokemon !== null) {
                zeigeDetail(gefundenesPokemon);
            }
        });

        // Menü und Detailansicht
        favlink.addEventListener("click", zeigeFavoriten);
        comparelink.addEventListener("click", zeigeVergleichen);
        document.getElementById("detail-close").addEventListener("click", schliesseDetail);

        // Start: Typ-Auswahl zurücksetzen (Browser merken sich Auswahlen), dann Pokemon holen und anzeigen
        typAuswahl.value = "";
        getdatafromdb();

    </script>
</body>

</html>
