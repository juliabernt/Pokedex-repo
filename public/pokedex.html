<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="stylesheet" href="pokedex.css">
</head>

<body>
    <header>
        <h1>Pokemon</h1> <!-- Überschrift der Seite -->
    </header>

    <div id="layout-container">
        <nav id="sidemenu">
            <ul>
                <li><a href="#">Pokedex</a></li>
                <li><a href="#">Typen</a></li>
            </ul>
        </nav>
        <main>
            <div id="searchbar-cont">
                <input type="text" id="searchbar" placeholder="Pokémon suchen..."> <!-- Suchfeld -->
                <button type="button" id="searchbtn">Suchen</button>
            </div>
            
            <div id="search-response-container">
                <p id="searchresponse">Gib einen Namen ein und klicke auf Suchen</p>
                <img id="searchimage" src="" alt="" style="display: none; width: 150px;">
            </div>
            <ul id="pokemon-list"></ul>
        </main>
    </div>

    <footer>
        <p>Pokedex Projekt | Web-Programmierung | Armbruster, Bendig, Bernt</p>
    </footer>


    <script>
        async function getdatafromdb() {
            const response = await fetch('/api/pokemon'); //Server nach Daten fragen 
            const pokedata = await response.json(); // Antwort in JS-Objekte umwandeln
            const list = document.getElementById("pokemon-list"); // die leere Liste holen

            for (let pokemon of pokedata) { // für jedes Pokemon
                const listelement = document.createElement("li"); // einen neuen Listeneintrag erstellen (das wird unsere Karte)
                const imageelement = document.createElement("img");    // // ein neues Bild-Element erstellen (noch leer, ohne Quelle)
                imageelement.src = "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/" + pokemon.id + ".png"; //// Bild-URL zusammensetzen: fester Link zum Bilder-Ordner + Pokemon-Nummer + Dateiendung
                listelement.textContent = pokemon.name; // Name als Text
                listelement.appendChild(imageelement); // beides in die Liste hängen
                list.appendChild(listelement);
            }
        }
        const searchbar = document.getElementById("searchbar"); // die drei Zeilen verbinden java script mit html elementen
        const searchbtn = document.getElementById("searchbtn");
        const searchresponse = document.getElementById("searchresponse");
        const searchimage = document.getElementById("searchimage");

        function searchforpokemon() { //unsere Methode für die Suche von Pokemons
            const eingabe = searchbar.value.toLowerCase().trim(); // eingabe vom nutzer
            if (eingabe === "") {
                searchresponse.textContent = "Bitte Namen eingeben";// wenn nichts eingegebn wurde
                searchimage.style.display = "none";
                return;
            }

            const allPokemon = document.querySelectorAll("#pokemon-list li"); //gibt mir alle Elemente aus der Liste zurück
            let treffer = null;

            for (let i of allPokemon) {
                if (i.textContent.toLowerCase().includes(eingabe)) { // Wenn Treffer gefunden: Den Text des passenden Listeneintrags in der Variable speichern
                    treffer = i;
                    break;
                }
            }

            //Ergebnis der Suche anzeigen
            if (treffer != null) {
                const name = treffer.firstChild.textContent;
                const image_in_card = treffer.querySelector("img");
                searchresponse.textContent = name;

                if (image_in_card) {
                    searchimage.src = image_in_card.src;
                    searchimage.alt = name;
                    searchimage.style.display = "block"; // Bild anzeigen
                }
            }
            else {
                searchresponse.textContent = "Kein Pokemon gefunden";
                searchimage.style.display = "none";
            }
        }

        searchbtn.addEventListener("click", searchforpokemon);
        // 2. Suche auslösen, wenn im Textfeld "Enter" gedrückt wird
        searchbar.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
                searchforpokemon();
            }
        });

        getdatafromdb();
    </script>
    <main>
    </main>
</body>

</html>
